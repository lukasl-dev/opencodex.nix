name: cron

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Update version and lockfiles
        id: update
        run: |
          previous_version=$(jq -r .version VERSION.json)

          nix run .#update --accept-flake-config

          version=$(jq -r .version VERSION.json)
          version_changed=false
          if [[ "$version" != "$previous_version" ]]; then
            version_changed=true
          fi

          {
            echo "version=$version"
            echo "version_changed=$version_changed"
          } >> "$GITHUB_OUTPUT"

      - name: Check package and modules
        run: |
          if git diff --quiet -- VERSION.json bun.lock bun.nix; then
            exit 0
          fi

          nix flake check --accept-flake-config

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_CHANGED: ${{ steps.update.outputs.version_changed }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code VERSION.json bun.lock bun.nix; then
            echo "No changes to commit"
            exit 0
          fi

          push_tag=false
          git add VERSION.json bun.lock bun.nix
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            git commit -m "Update OpenCodex to ${VERSION}"

            if ! git ls-remote --tags --refs origin "refs/tags/${VERSION}" | grep -q .; then
              git tag -a "${VERSION}" -m "${VERSION}"
              push_tag=true
            fi
          else
            git commit -m "Update lockfiles"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Updater left uncommitted changes"
            git status --short
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
          if [[ "$push_tag" == "true" ]]; then
            git push origin "refs/tags/${VERSION}"
          fi
